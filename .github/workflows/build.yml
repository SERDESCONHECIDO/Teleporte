name: Build Android Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Baixar DLLs de referência oficiais (mod-reference-assemblies)
        run: |
          wget -q https://github.com/StardewModders/mod-reference-assemblies/archive/refs/heads/main.zip -O refs.zip
          unzip -q refs.zip
          # Copia as DLLs necessárias para a pasta libs/ (nomes em minúsculo no repositório)
          mkdir -p libs
          # O pacote extrai em uma pasta com nome variável; localizamos os arquivos
          find mod-reference-assemblies-main -name "Stardew Valley.dll" -exec cp {} libs/ \;
          find mod-reference-assemblies-main -name "StardewModdingAPI.dll" -exec cp {} libs/ \;
          find mod-reference-assemblies-main -name "SMAPI.Toolkit.CoreInterfaces.dll" -exec cp {} libs/ \;
          find mod-reference-assemblies-main -name "MonoGame.Framework.dll" -exec cp {} libs/ \;
          find mod-reference-assemblies-main -name "xTile.dll" -exec cp {} libs/ \;
          find mod-reference-assemblies-main -name "0Harmony.dll" -exec cp {} libs/ \;

      - name: Compilar
        run: dotnet build --configuration Release

      - name: Empacotar mod
        run: |
          mkdir -p dist/ShipEquipment
          cp bin/Release/net6.0/ShipEquipment.dll dist/ShipEquipment/
          cp manifest.json dist/ShipEquipment/
          cd dist && zip -r ShipEquipment.zip ShipEquipment/

      - name: Upload do Artefato
        uses: actions/upload-artifact@v4
        with:
          name: ShipEquipment-Mod
          path: dist/ShipEquipment.zip
