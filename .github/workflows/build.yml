name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Preparar Dependências (SMAPI e Jogo)
      run: |
        mkdir -p /home/runner/game
        cd /home/runner/game
        
        # 1. Baixa o SMAPI oficial
        wget -q https://github.com/Pathoschild/SMAPI/releases/download/4.1.10/SMAPI-4.1.10-for-developers.zip
        unzip -q SMAPI-4.1.10-for-developers.zip -d SMAPI_Temp
        cp SMAPI_Temp/*.dll .
        
        # 2. Baixa o Stardew Valley.dll de um novo espelho público (Versão 1.6)
        wget -q -O "Stardew Valley.dll" https://github.com/Pathoschild/SMAPI/raw/develop/src/SMAPI.Tests/TestGame/Stardew%20Valley.dll

        # 3. Verifica se os arquivos estão na pasta
        ls -la

    - name: Restaurar dependências
      run: dotnet restore

    - name: Compilar o Mod
      run: |
        dotnet build -c Release /p:GamePath="/home/runner/game" /p:EnableModDeploy=false

    - name: Fazer Upload do Mod
      uses: actions/upload-artifact@v4
      with:
        name: VenderEquipamentos-Android
        path: bin/Release/net8.0/VenderEquipamentos.dll
