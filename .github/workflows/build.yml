name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Baixar Stardew Valley 1.6.15 e SMAPI
      run: |
        mkdir -p /home/runner/game
        cd /home/runner/game
        
        # 1. Baixa o SMAPI (URL CORRIGIDA: for-developers em vez do zip inexistente)
        wget -q https://github.com/Pathoschild/SMAPI/releases/download/4.1.10/SMAPI-4.1.10-for-developers.zip
        unzip -q SMAPI-4.1.10-for-developers.zip -d SMAPI
        cp SMAPI/*.dll .
        
        # 2. Baixa o Stardew Valley.dll (Cópia pública usada para CI)
        # Se este link falhar, baixe o "Stardew Valley.dll" do seu PC e suba para o seu GitHub.
        # Depois troque a URL abaixo por: wget -q https://raw.githubusercontent.com/SEU_USUARIO/SEU_REPO/main/StardewValley.dll
        wget -q -O StardewValley.dll https://github.com/WeDias/StardewValley-1.6/raw/main/StardewValley.dll
        
    - name: Restaurar dependências
      run: dotnet restore

    - name: Compilar o Mod
      run: |
        dotnet build -c Release /p:GamePath="/home/runner/game" /p:EnableModDeploy=false

    - name: Fazer Upload do Mod
      uses: actions/upload-artifact@v4
      with:
        name: VenderEquipamentos-Android
        path: bin/Release/net8.0/VenderEquipamentos.dll
