name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Preparar Dependências (Referências da Comunidade)
      run: |
        mkdir -p /home/runner/game
        cd /home/runner/game

        # 1. Baixa o repositório oficial de referências para CI
        wget -q https://github.com/StardewModders/mod-reference-assemblies/archive/refs/heads/main.zip
        unzip -q main.zip

        # 2. Copia todas as DLLs necessárias (incluindo o MonoGame)
        cp mod-reference-assemblies-main/*.dll .
        cp mod-reference-assemblies-main/smapi-internal/*.dll .

        # 3. Verifica se os arquivos essenciais estão no lugar
        echo "--- Arquivos baixados ---"
        ls -la | grep -E "Stardew Valley.dll|MonoGame.Framework.dll|StardewModdingAPI.dll"

    - name: Restaurar dependências
      run: dotnet restore

    - name: Compilar o Mod
      run: |
        dotnet build -c Release /p:GamePath="/home/runner/game" /p:EnableModDeploy=false

    - name: Fazer Upload do Mod
      uses: actions/upload-artifact@v4
      with:
        name: VenderEquipamentos-Android
        path: bin/Release/net8.0/VenderEquipamentos.dll
